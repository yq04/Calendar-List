<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日历清单 · Calendar List</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/panel.css" />
</head>
<body>
<div id="kal-root" class="kal-root">
  <div id="kal-backdrop" class="kal-backdrop" aria-hidden="true">
    <div class="kal-backdrop-art"></div>
    <div class="kal-backdrop-img"></div>
    <div class="kal-backdrop-vignette"></div>
  </div>
  <header class="kal-header" data-tauri-drag-region>
    <div class="kal-title" id="kal-title-trigger" title="选择年份与月份">
      <img class="kal-brand-logo" src="./favicon.png" alt="日历清单" width="22" height="22" />
      <span id="kal-month-label" class="kal-month-label">--</span>
      <div class="kal-title-meta">
        <span id="kal-year-label" class="kal-year-label"></span>
        <span id="kal-lunar-year" class="kal-lunar-year"></span>
        <span id="kal-week-badge" class="kal-week-badge" title="当前周次"></span>
        <span id="kal-app-version" class="kal-version-pill" title="日历清单 v0.1.0">v0.1.0</span>
      </div>
    </div>
    <nav class="kal-nav">
      <button id="kal-prev" class="kal-btn kal-btn-icon" title="上个月" aria-label="上个月"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="kal-today" class="kal-btn kal-btn-ghost" title="回到今天 (T)">今天</button>
      <button id="kal-next" class="kal-btn kal-btn-icon" title="下个月" aria-label="下个月"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button id="kal-view-toggle" class="kal-btn kal-btn-ghost" type="button"
              title="切换月视图 / 周视图 (W)" aria-pressed="false" aria-label="切换周视图">周视图</button>
    </nav>
    <div class="kal-spacer" data-tauri-drag-region></div>
    <div class="kal-meta">
      <span id="kal-display-tag" class="kal-tag" title="当前显示器"></span>
      <span id="kal-source-tag" class="kal-tag" title="当前主题">-</span>
      <button id="kal-lock-btn" class="kal-btn kal-btn-ghost" type="button"
              title="固定到桌面（默认占据屏幕左侧，可在设置中调整位置；Shift+点击开启鼠标穿透）" aria-pressed="false" aria-label="固定到桌面"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>固定</span></button>
      <button id="kal-privacy-btn" class="kal-btn kal-btn-ghost" type="button"
              title="防窥遮罩" aria-pressed="false" aria-label="防窥遮罩"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span>防窥</span></button>
      <button id="kal-quick-glass" class="kal-btn kal-btn-ghost" type="button"
              title="切换透明底" aria-label="切换透明底"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/></svg><span>透明底</span></button>
      <button id="kal-search-btn" class="kal-btn kal-btn-ghost" type="button"
              title="搜索 (Ctrl+F)" aria-label="搜索安排"
              aria-expanded="false" aria-controls="kal-search-popover"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>搜索</span></button>
      <button id="kal-export-btn" class="kal-btn kal-btn-ghost" type="button"
              title="导出与导入日历" aria-label="导出日历"
              aria-expanded="false" aria-controls="kal-export-popover"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>导出</span></button>
      <button id="kal-refresh" class="kal-btn kal-btn-icon kal-btn-ghost" type="button"
              title="刷新" aria-label="重新检查状态并刷新日历"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button id="kal-settings" class="kal-btn kal-btn-icon kal-btn-ghost" title="设置" aria-label="个性化设置"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      <div class="kal-win-ctls">
        <button id="kal-win-min" class="kal-btn kal-btn-icon kal-btn-ghost" type="button" title="最小化窗口" aria-label="最小化窗口"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="kal-win-close" class="kal-btn kal-btn-icon kal-btn-ghost kal-win-close-btn" type="button" title="隐藏到系统托盘 (Alt+Space 唤醒)" aria-label="隐藏到系统托盘"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>
  </header>

  <section id="kal-ym-popover" class="kal-ym-popover" hidden aria-label="快速跳转年月">
    <div class="kal-ym-head">
      <button id="kal-ym-prev-year" class="kal-btn kal-btn-ghost" type="button" title="上一年">&#8249; 上一年</button>
      <strong id="kal-ym-year-label" class="kal-ym-year-label">2026</strong>
      <button id="kal-ym-next-year" class="kal-btn kal-btn-ghost" type="button" title="下一年">下一年 &#8250;</button>
    </div>
    <div id="kal-ym-months" class="kal-ym-months"></div>
  </section>

  <section id="kal-search-popover" class="kal-search-popover" hidden aria-label="搜索安排">
    <div class="kal-search-bar">
      <input id="kal-search-input" class="kal-search-input" type="search"
             placeholder="搜索安排…"
             aria-label="搜索关键词" autocomplete="off" />
      <button id="kal-search-close" class="kal-btn kal-btn-ghost kal-search-close"
              type="button" title="关闭 (Esc)" aria-label="关闭搜索">关闭</button>
    </div>
    <div id="kal-search-filters" class="kal-search-filters" role="group" aria-label="搜索完成状态筛选">
      <button type="button" class="kal-filter-chip is-active" data-filter="all">全部</button>
      <button type="button" class="kal-filter-chip" data-filter="todo">未完成</button>
      <button type="button" class="kal-filter-chip" data-filter="done">已完成</button>
    </div>
    <div id="kal-search-meta" class="kal-search-meta" aria-live="polite"></div>
    <ul id="kal-search-list" class="kal-search-list" role="listbox" aria-label="搜索结果列表"></ul>
  </section>

  <section id="kal-export-popover" class="kal-export-popover" hidden aria-label="导出与打印日历">
    <div class="kal-export-head">
      <span class="kal-export-title">导出与导入</span>
      <button id="kal-export-close" class="kal-btn kal-btn-ghost" type="button" title="关闭 (Esc)">关闭</button>
    </div>
    <div class="kal-export-row">
      <span>纸张方向</span>
      <div class="kal-export-seg" id="kal-export-orient" role="group" aria-label="纸张方向">
        <button type="button" class="kal-filter-chip is-active" data-orient="landscape">横向</button>
        <button type="button" class="kal-filter-chip" data-orient="portrait">纵向</button>
      </div>
    </div>
    <div class="kal-export-row">
      <span>纸张尺寸</span>
      <div class="kal-export-seg" id="kal-export-paper" role="group" aria-label="纸张尺寸">
        <button type="button" class="kal-filter-chip is-active" data-paper="A4">A4</button>
        <button type="button" class="kal-filter-chip" data-paper="Letter">Letter</button>
        <button type="button" class="kal-filter-chip" data-paper="A3">A3</button>
      </div>
    </div>
    <div class="kal-export-row">
      <span>页面边距</span>
      <div class="kal-export-seg" id="kal-export-margin" role="group" aria-label="打印区域边距">
        <button type="button" class="kal-filter-chip is-active" data-margin="6">满幅</button>
        <button type="button" class="kal-filter-chip" data-margin="10">标准</button>
      </div>
    </div>
    <div class="kal-export-checks">
      <label><input type="checkbox" id="kal-export-lunar" checked /> 农历与休/班</label>
      <label><input type="checkbox" id="kal-export-almanac" checked /> 干支与统计</label>
      <label><input type="checkbox" id="kal-export-completed" checked /> 已完成事项</label>
      <label><input type="checkbox" id="kal-export-detail" checked /> 附每日明细</label>
    </div>
    <div class="kal-export-actions">
      <button id="kal-export-pdf" class="kal-btn kal-export-primary" type="button">导出 PDF</button>
      <button id="kal-export-md" class="kal-btn" type="button">导出 Markdown</button>
      <button id="kal-export-ics-btn" class="kal-btn" type="button">导出 .ics</button>
      <button id="kal-export-import-ics" class="kal-btn kal-btn-ghost" type="button">导入 .ics</button>
      <button id="kal-export-print" class="kal-btn kal-btn-ghost" type="button">打印预览</button>
    </div>
    <input id="kal-ics-file-input" type="file" accept=".ics,text/calendar" hidden />
    <div id="kal-export-status" class="kal-export-status" role="status" aria-live="polite"></div>
  </section>

  <section id="kal-day-more-popover" class="kal-day-more-popover" hidden aria-label="当日全部事项">
    <div class="kal-day-more-head">
      <strong id="kal-day-more-title">当日全部事项</strong>
      <button id="kal-day-more-close" class="kal-btn kal-btn-ghost" type="button">关闭</button>
    </div>
    <ul id="kal-day-more-list" class="kal-day-more-list"></ul>
  </section>

  <main class="kal-body">
    <div class="kal-calendar-col">
      <div class="kal-weekhead" id="kal-weekhead"></div>
      <div class="kal-grid" id="kal-grid"></div>
    </div>
    <aside class="kal-agenda" id="kal-agenda">
      <div class="kal-agenda-head">
        <span id="kal-agenda-date" class="kal-agenda-date"></span>
        <div class="kal-agenda-head-right">
          <span id="kal-agenda-count" class="kal-count"></span>
          <button id="kal-undo-btn" class="kal-btn kal-btn-ghost kal-agenda-copy-btn" type="button" hidden
                  title="撤销 (Ctrl+Z)" aria-label="撤销">撤销</button>
          <button id="kal-rollover-btn" class="kal-btn kal-btn-ghost kal-agenda-copy-btn" type="button"
                  title="顺延未完成事项" aria-label="顺延未完成">顺延</button>
          <button id="kal-agenda-copy" class="kal-btn kal-btn-ghost kal-agenda-copy-btn" type="button"
                  title="复制当天清单" aria-label="复制当天清单">复制</button>
          <button id="kal-agenda-ics" class="kal-btn kal-btn-ghost kal-agenda-copy-btn" type="button"
                  title="导出 .ics" aria-label="导出 ICS 日历">ICS</button>
        </div>
      </div>
      <div id="kal-agenda-sub" class="kal-agenda-sub"></div>
      <form id="kal-agenda-add" class="kal-agenda-add" autocomplete="off">
        <div class="kal-agenda-add-main">
          <input id="kal-agenda-input" class="kal-agenda-input" type="text"
                 placeholder="添加安排" aria-label="添加安排" />
          <button id="kal-time-toggle-btn" class="kal-btn kal-btn-icon kal-time-toggle-btn" type="button"
                  title="时间与选项" aria-expanded="false"
                  aria-controls="kal-agenda-add-meta" aria-label="手动指定时间"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></button>
          <button class="kal-btn kal-btn-icon kal-agenda-add-btn" type="submit" title="添加安排"><svg class="kal-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        </div>
        <div id="kal-agenda-add-meta" class="kal-agenda-add-meta" hidden>
          <div class="kal-agenda-meta-row">
            <label class="kal-agenda-meta-label" for="kal-agenda-time-input">时间</label>
            <input id="kal-agenda-time-input" class="kal-agenda-time-input" type="text"
                   inputmode="numeric" maxlength="5" placeholder="HH:MM"
                   aria-label="手动输入时间" />
            <div class="kal-agenda-time-presets" role="group" aria-label="快捷时间">
              <button type="button" class="kal-time-chip" data-time="09:00">09:00</button>
              <button type="button" class="kal-time-chip" data-time="14:00">14:00</button>
              <button type="button" class="kal-time-chip" data-time="20:00">20:00</button>
              <button type="button" class="kal-time-chip is-clear" data-time="">无时间</button>
            </div>
          </div>
          <div class="kal-agenda-meta-row">
            <label class="kal-agenda-meta-label" for="kal-agenda-date-input">日期</label>
            <input id="kal-agenda-date-input" class="kal-agenda-date-input" type="date"
                   min="1970-01-01" max="2099-12-31" aria-label="安排目标日期" />
            <button type="button" id="kal-agenda-prio-btn" class="kal-time-chip kal-prio-chip"
                    aria-pressed="false" title="标记为重点">! 重要</button>
          </div>
          <div id="kal-cell-color-bar" class="kal-cell-color-bar" role="group" aria-label="当日单元格背景染色"></div>
        </div>
      </form>
      <div id="kal-nlp-preview" class="kal-nlp-preview" hidden aria-live="polite"></div>
      <div id="kal-write-status" class="kal-write-status" aria-live="polite"></div>
      <div id="kal-pending-box" class="kal-pending-box" hidden aria-live="assertive"></div>
      <ul class="kal-agenda-list" id="kal-agenda-list"></ul>
      <button id="kal-agenda-inline-trigger" class="kal-agenda-inline-trigger" type="button"
              title="添加安排">+ 添加安排</button>
      <section class="kal-productivity" id="kal-productivity" aria-label="本地工具">
        <details class="kal-tools-section">
          <summary>重要日期</summary>
          <ul id="kal-countdowns" class="kal-countdowns"></ul>
          <details class="kal-countdown-editor">
            <summary>添加倒计时</summary>
            <form id="kal-countdown-form" autocomplete="off">
              <input id="kal-countdown-title" type="text" maxlength="80" required placeholder="名称" aria-label="倒计时标题" />
              <input id="kal-countdown-date" type="date" required min="0001-01-01" max="9999-12-31" aria-label="倒计时日期" />
              <button class="kal-btn kal-btn-ghost" type="submit">保存</button>
            </form>
          </details>
          <div id="kal-productivity-status" class="kal-tools-status" role="status"></div>
        </details>
        <details class="kal-tools-section" id="kal-notes">
          <summary>便签本</summary>
          <details class="kal-countdown-editor" id="kal-note-editor">
            <summary>+ 新建便签</summary>
            <form id="kal-note-form" autocomplete="off">
              <input id="kal-note-title-input" type="text" maxlength="120" required placeholder="标题" aria-label="便签标题" />
              <textarea id="kal-note-content-input" class="kal-holiday-textarea" rows="3" placeholder="正文内容" aria-label="便签正文"></textarea>
              <button class="kal-btn kal-btn-ghost" type="submit">保存便签</button>
            </form>
          </details>
          <button id="kal-notes-refresh" class="kal-btn kal-btn-ghost" type="button">刷新便签</button>
          <div id="kal-notes-status" class="kal-tools-status" role="status"></div>
          <div id="kal-note-list"></div>
          <button id="kal-notes-more" class="kal-btn kal-btn-ghost" type="button" hidden>加载更多</button>
        </details>
        <details class="kal-tools-section" id="kal-holiday-section">
          <summary>节假日配置</summary>
          <div class="kal-holiday-editor">
            <textarea id="kal-holiday-json" class="kal-holiday-textarea" spellcheck="false"
                      aria-label="法定节假日 JSON 配置"
                      placeholder='粘贴节假日 JSON 配置'></textarea>
            <div class="kal-holiday-actions">
              <button id="kal-holiday-save" class="kal-btn kal-btn-ghost kal-holiday-btn" type="button">应用并保存</button>
              <button id="kal-holiday-sample" class="kal-btn kal-btn-ghost kal-holiday-btn" type="button">填入示例</button>
              <button id="kal-holiday-reset" class="kal-btn kal-btn-ghost kal-holiday-btn" type="button">恢复内置</button>
            </div>
            <div id="kal-holiday-status" class="kal-tools-status" role="status"></div>
          </div>
        </details>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
